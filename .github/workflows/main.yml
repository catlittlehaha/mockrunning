name: Auto Mock Running - Sports World

on:
  schedule:
    # 每天 UTC 时间 12:40 (即北京时间 20:40) 自动运行
    - cron: '40 12 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Running Script
        env:
          # 运动世界校园 专属环境变量
          SW_IMEI: ${{ secrets.SW_IMEI }}
          SW_PASSWORD: ${{ secrets.SW_PASSWORD }}
        run: |
          python main.py
